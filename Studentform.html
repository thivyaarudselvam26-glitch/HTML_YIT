<tr>
  <td><label for="fname">First Name:</label></td>
  <td><input type="text" placeholder="Enter the name" id="fname" name="fname"></td></tr>

  <td><label for="lname">Last Name:</label></td>
 <td><input type="text"placeholder="Enter the name" id="lname" name="lname"><br><br></td></tr>

  <tr><td><label>Gender:</label></td>
      <td><input type="radio" id="male" name="gender" value="male">
	  <label for="male">Male</label><br>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label></td></tr>

  <tr><td><label for="email">E-mail:</label></td>
 <td><input type="email" placeholder="Enter your E-mail" id="email" name="email"><br><br><td></tr>

  <tr><td><label for="password">Password:</label></td>
  <td><input type="password" id="password" name="password"></td>

  <tr><td><label for="address">Address:</label></td>
  <td><input type="textarea" id="address" name="address"></td></tr>

 <tr><td><label for="time">Time:</label></td>
  <td><input type="time" id="time" name="time"></td></tr>

  <tr><td><label for="date">Date:</label></td>
  <td><input type="date" id="date" name="date"></td></tr>

  <tr><td><label for="month">Birth Month:</label></td>
  <td><input type="month" id="month" name="month"></td></tr>

  <tr><td><label for="datetime">Date & Time:</label></td>
  <td><input type="datetime-local" id="datetime" name="datetime"></td></tr>

  <tr><td><label for="search">Search:</label></td>
  <td><input type="search" id="search" name="search"></td></tr>

  <tr><td><label for="tel">Phone:</label></td>
  <td><input type="tel" id="tel" name="tel"></td></tr>

  <tr><td><label for="week">Week:</label></td>
  <td><input type="days" id="week" name="week"></td></tr>

  <tr><td><label for="file">Upload your cv:</label></td>
  <td><input type="file" id="file" name="file"></td></tr>
  
  <tr><td><label>Course</label><br></td>
      <td><select><option>Select Course</option>
           <option>HTML</option>
            <option>css</option>
            <option>java script</option></select></td></tr>

   <tr><td><input type="hidden" id="custId" name="custId" value="3487"></td></tr>

     <tr><td><label for="favcolor">Select your favorite color:</label></td>
     <td><input type="color" id="favcolor" name="favcolor" value="#ff0000"></td></tr>


  <tr><td><label>Is it correct?</label></td>
  <td><input type="radio" name="answer" value="true"> True<br>
  <input type="radio" name="answer" value="false"> False</td></tr>
  
    
   <tr><td><label for="range">Final points: </label></td>
   <td><input type="range" id="range" name="range"></td></tr>



  <tr><td colspan="2"> <input input type="submit" value="Submit"></td></tr>
  <tr><td><input type="reset" value="Reset"></td></tr>
  </table border="1">
</form>
